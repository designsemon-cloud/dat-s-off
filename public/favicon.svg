<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The "D." mark from the chat's assistant avatar, dressed like the primary
       button (CosmicButton): a raised neutral surface inside an orange ring. -->
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ea580c" />
      <stop offset="0.28" stop-color="#ec631b" />
      <stop offset="0.5" stop-color="#f39256" />
      <stop offset="0.72" stop-color="#ec631b" />
      <stop offset="1" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="surface" x1="0" y1="0" x2="0" y2="1">
      <stop class="s-top" offset="0" />
      <stop class="s-bottom" offset="1" />
    </linearGradient>
  </defs>
  <style>
    .s-top { stop-color: #ffffff; }
    .s-bottom { stop-color: #f3f3f5; }
    .mark { fill: #1e2022; }
    .sheen { stroke: rgba(255, 255, 255, 0.9); }
    @media (prefers-color-scheme: dark) {
      .s-top { stop-color: #26282c; }
      .s-bottom { stop-color: #1c1d20; }
      .mark { fill: #f3f3f5; }
      .sheen { stroke: rgba(255, 255, 255, 0.14); }
    }
  </style>
  <rect width="64" height="64" rx="17" fill="url(#ring)" />
  <rect x="6" y="6" width="52" height="52" rx="12" fill="url(#surface)" />
  <path class="sheen" d="M18 7 H46" stroke-width="1.2" stroke-linecap="round" fill="none" />
  <text class="mark" x="32" y="43" text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="29" font-weight="700" letter-spacing="-1">D.</text>
</svg>
