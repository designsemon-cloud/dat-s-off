<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The "D." mark from the chat's assistant avatar (ChatPane), as the tab icon. -->
  <style>
    .tile { fill: #f3f3f5; stroke: #d8dbdf; }
    .mark { fill: #1e2022; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #26282c; stroke: #2e3035; }
      .mark { fill: #f3f3f5; }
    }
  </style>
  <rect class="tile" x="2" y="2" width="60" height="60" rx="15" stroke-width="3" />
  <text class="mark" x="32" y="44" text-anchor="middle"
    font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
    font-size="34" font-weight="700" letter-spacing="-1">D.</text>
</svg>
